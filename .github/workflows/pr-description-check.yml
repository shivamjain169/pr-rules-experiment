name: "PR Description Check"

on:
  pull_request:
    types:
      - opened
      - edited
      - synchronize

jobs:
  description-check:
    runs-on: ubuntu-latest
    steps:
      - name: Validate PR description
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          echo "$PR_BODY" > pr_body.txt

          if [ -z "$PR_BODY" ]; then
            echo "❌ PR description is empty. Please describe what changed and why."
            exit 1
          fi

          BODY_LENGTH=$(wc -m < pr_body.txt)
          if [ "$BODY_LENGTH" -lt 30 ]; then
            echo "❌ PR description is too short (minimum 30 characters). Please add more detail."
            exit 1
          fi

          if ! grep -q "## Summary" pr_body.txt; then
            echo "❌ PR description is missing a '## Summary' section."
            exit 1
          fi

          if ! grep -q "## Testing" pr_body.txt; then
            echo "❌ PR description is missing a '## Testing' section."
            exit 1
          fi

          echo "✅ PR description passed all checks."
