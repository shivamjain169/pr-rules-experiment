name: "PR Standards Check"

# Runs on pull_request_target because both checks only read PR metadata
# (title, body) via the GitHub API/event context — no PR code is checked
# out or executed, so this is safe to run on PRs from forks too.
on:
  pull_request_target:
    types:
      - opened
      - edited
      - synchronize

permissions:
  pull-requests: read

jobs:
  # ---------------------------------------------------------------------
  # JOB 1: Validate the PR title against Conventional Commits.
  # Keep the "types" list identical to whatever release-please is
  # configured with, since release-please reads this same title to decide
  # the version bump and changelog entry when the PR is squash-merged.
  # ---------------------------------------------------------------------
  title-check:
    name: Validate PR title
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            revert
          requireScope: false
          subjectPattern: ^(?![A-Z]).+$
          subjectPatternError: |
            The description after the colon must start with a lowercase
            letter (e.g. "fix: correct retry logic", not "fix: Correct...").
          wip: true
          validateSingleCommit: false

  # ---------------------------------------------------------------------
  # JOB 2: Validate the PR description against the required template
  # sections. Mirrors .github/pull_request_template.md — update both
  # together if the template changes.
  # ---------------------------------------------------------------------
  description-check:
    name: Validate PR description
    runs-on: ubuntu-latest
    steps:
      - name: Validate PR description content
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -e
          echo "$PR_BODY" > pr_body.txt
          FAIL=0

          fail() {
            echo "❌ $1"
            FAIL=1
          }

          # --- Not empty / not trivially short ---------------------------
          if [ -z "$PR_BODY" ]; then
            fail "PR description is empty. Fill in the PR template."
          fi

          BODY_LENGTH=$(wc -m < pr_body.txt)
          if [ "$BODY_LENGTH" -lt 80 ]; then
            fail "PR description is too short (minimum 80 characters). Add more detail to each section."
          fi

          # --- Required sections present ----------------------------------
          for SECTION in "## Summary" "## Related Issue" "## Type of Change" "## Configuration" "## Feature Flag" "## Testing"; do
            if ! grep -qF "$SECTION" pr_body.txt; then
              fail "Missing required section: '$SECTION'."
            fi
          done

          # --- At least one "Type of Change" box is checked ---------------
          if ! grep -qE '^\s*-\s*\[[xX]\]' pr_body.txt; then
            fail "No box checked under 'Type of Change'. Check at least one."
          fi

          # --- Related Jira ticket, or an explicit opt-out -----------------
          if ! grep -qE '[A-Z]{2,10}-[0-9]+' pr_body.txt \
             && ! grep -qi "no related ticket" pr_body.txt; then
            fail "No Jira ticket key found (e.g. PROJ-123) under 'Related Issue'. If there genuinely isn't one, write 'No related ticket' explicitly."
          fi

          # --- Breaking change requires migration details ------------------
          if grep -qiE '^\s*-\s*\[[xX]\]\s*breaking change' pr_body.txt; then
            if ! grep -qF "## Breaking Change Details" pr_body.txt; then
              fail "'Breaking change' is checked but the '## Breaking Change Details' section is missing."
            else
              # crude check that something was actually written under that heading,
              # not just the placeholder comment left in place
              DETAILS=$(awk '/## Breaking Change Details/{flag=1; next} /^## /{flag=0} flag' pr_body.txt | grep -v '<!--' | tr -d '[:space:]')
              if [ -z "$DETAILS" ]; then
                fail "'## Breaking Change Details' section is present but empty. Describe what breaks and the migration path."
              fi
            fi
          fi

          if [ "$FAIL" -eq 1 ]; then
            echo ""
            echo "See .github/pull_request_template.md for the full expected structure."
            exit 1
          fi

          echo "✅ PR description passed all checks."
