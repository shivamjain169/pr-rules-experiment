name: "PR Standards Check"

# =============================================================================
# Validates two things on every pull request before it can be merged:
#
#   1. title-check       - the PR title must contain a valid, verified Jira
#                           ticket ID (e.g. "PROJ-123: fix retry logic").
#                           No commit-type prefix (feat/fix/docs/...) is
#                           required - that Conventional Commits check was
#                           deliberately removed. A title starting with WIP
#                           skips this check entirely. The ticket ID is
#                           verified live against the Jira API; if that
#                           verification fails for any reason (ticket not
#                           found, Jira unreachable, credentials missing),
#                           the check fails and blocks merge - there is no
#                           "pass anyway" fallback for Jira problems.
#
#   2. description-check - the PR description follows the required template
#                           (feature flag status, breaking change details,
#                           etc.), and automatically detects whether the PR
#                           touches Local Agent code (Compute, Orchestrator,
#                           or Proxy) from the actual file diff, only
#                           requiring the extra impact details when that's
#                           genuinely the case.
#
# The two jobs have no `needs:` relationship, so they run in parallel on
# separate runners. Total workflow time is the slower of the two jobs, not
# their sum.
#
# Neither job uses a third-party GitHub Action - both are self-contained
# bash scripts using only tools preinstalled on ubuntu-latest (bash, grep,
# awk, sed, curl, jq).
# =============================================================================

on:
  pull_request_target:
    types:
      - opened
      - edited
      - synchronize
      - reopened

# Cancel a stale run for the same PR when a new commit is pushed, instead of
# letting outdated runs queue up behind the latest one.
concurrency:
  group: pr-standards-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

# Workflow-level default. Each job below declares its own permissions - see
# the note in each job for why that is necessary.
permissions:
  pull-requests: read

jobs:

  # ---------------------------------------------------------------------
  # IMPORTANT:
  # Keep these job IDs (`title-check`, `description-check`) unchanged.
  # They are referenced by name in the repository ruleset's required
  # status checks. Renaming a job ID here silently breaks branch
  # protection until the ruleset is updated to match the new ID.
  # ---------------------------------------------------------------------

  title-check:
    name: PR Title Check
    runs-on: ubuntu-latest
    timeout-minutes: 5

    # Only the two scopes actually used: commenting on the PR. No
    # `statuses: write` or `contents: read` needed here anymore - those
    # were specific to the third-party title-linting action, which this
    # job no longer uses.
    permissions:
      pull-requests: write
      issues: write

    steps:
      - name: Validate PR title (Jira ticket required, WIP exempt)
        env:
          TITLE: ${{ github.event.pull_request.title }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
        run: |
          set -e

          MARKER="<!-- pr-title-check-bot -->"
          STATE=""       # pass | wip | missing | not_found | api_error
          JIRA_KEY=""

          # -------------------------------------------------------------
          # WIP passthrough: a title starting with "WIP" (any case,
          # optionally bracketed, followed by a colon or space) skips
          # all validation and passes outright.
          # -------------------------------------------------------------
          if printf '%s' "$TITLE" | grep -qiE '^[[:space:]]*\[?wip\]?[:[:space:]]'; then
            STATE="wip"
          else
            # -----------------------------------------------------------
            # Extract a Jira ticket key anywhere in the title (e.g.
            # PROJ-123). Matched case-insensitively, then normalized to
            # uppercase for the API call - Jira keys are conventionally
            # uppercase but the API itself is case-insensitive on lookup.
            # -----------------------------------------------------------
            JIRA_KEY=$(printf '%s' "$TITLE" | grep -oE '[A-Za-z]{2,10}-[0-9]+' | head -n1 | tr '[:lower:]' '[:upper:]')

            if [ -z "$JIRA_KEY" ]; then
              STATE="missing"
            elif [ -z "$JIRA_BASE_URL" ] || [ -z "$JIRA_EMAIL" ] || [ -z "$JIRA_API_TOKEN" ]; then
              echo "::error title=PR title check::Jira credentials are not configured (JIRA_BASE_URL / JIRA_EMAIL / JIRA_API_TOKEN secrets) - cannot verify $JIRA_KEY."
              STATE="api_error"
            else
              HTTP_CODE=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 \
                -u "$JIRA_EMAIL:$JIRA_API_TOKEN" \
                -H "Accept: application/json" \
                "$JIRA_BASE_URL/rest/api/3/issue/$JIRA_KEY") || HTTP_CODE="000"

              if [ "$HTTP_CODE" = "200" ]; then
                STATE="pass"
              elif [ "$HTTP_CODE" = "404" ]; then
                STATE="not_found"
              else
                echo "::error title=PR title check::Could not verify Jira ticket $JIRA_KEY (HTTP $HTTP_CODE)."
                STATE="api_error"
              fi
            fi
          fi

          # -------------------------------------------------------------
          # One summary block, written once - not split across steps.
          # -------------------------------------------------------------
          case "$STATE" in
            wip)
              {
                echo "## 🚧 PR Title Check — Skipped (WIP)"
                echo
                echo "![wip](https://img.shields.io/badge/PR%20Title-WIP-lightgrey)"
                echo
                echo "Title is marked WIP — Jira ticket validation is skipped until it's ready for review."
              } >> "$GITHUB_STEP_SUMMARY"
              ;;
            pass)
              {
                echo "## ✅ PR Title Check — Passed"
                echo
                echo "![passing](https://img.shields.io/badge/PR%20Title-Passed-brightgreen)"
                echo
                echo "Title references verified Jira ticket **$JIRA_KEY**."
              } >> "$GITHUB_STEP_SUMMARY"
              ;;
            missing)
              {
                echo "## ❌ PR Title Check — Failed"
                echo
                echo "![failing](https://img.shields.io/badge/PR%20Title-Failed-red)"
                echo
                echo "No Jira ticket ID found in the PR title."
                echo
                echo "**Expected:** a ticket key somewhere in the title, e.g. \`PROJ-123: fix retry logic\`."
                echo
                echo "**Or:** prefix the title with \`WIP\` if this isn't ready for a ticket yet."
              } >> "$GITHUB_STEP_SUMMARY"
              ;;
            not_found)
              {
                echo "## ❌ PR Title Check — Failed"
                echo
                echo "![failing](https://img.shields.io/badge/PR%20Title-Failed-red)"
                echo
                echo "Jira ticket **$JIRA_KEY** was not found in Jira. Double-check the ticket ID."
              } >> "$GITHUB_STEP_SUMMARY"
              ;;
            api_error)
              {
                echo "## ❌ PR Title Check — Failed"
                echo
                echo "![failing](https://img.shields.io/badge/PR%20Title-Failed-red)"
                echo
                echo "Could not verify Jira ticket **$JIRA_KEY** (API error, timeout, or missing credentials). This blocks merge - there is no non-blocking fallback for Jira problems."
              } >> "$GITHUB_STEP_SUMMARY"
              ;;
          esac

          # -------------------------------------------------------------
          # PR comment - same "find existing marker, update in place"
          # pattern as description-check, using its own separate marker.
          # -------------------------------------------------------------
          case "$STATE" in
            wip)
              BODY="$MARKER"$'\n'"> [!NOTE]"$'\n'"> **PR title is marked WIP** — Jira ticket validation skipped for now."
              ;;
            pass)
              BODY="$MARKER"$'\n'"> [!TIP]"$'\n'"> **PR title looks good** ✅ — references verified ticket **$JIRA_KEY**."
              ;;
            missing)
              BODY="$MARKER"$'\n'"> [!CAUTION]"$'\n'"> **PR title needs a Jira ticket**"$'\n'">"$'\n'"> No Jira ticket ID was found in the title. Add one (e.g. \`PROJ-123: fix retry logic\`), or prefix the title with \`WIP\` if this isn't ready yet."
              ;;
            not_found)
              BODY="$MARKER"$'\n'"> [!CAUTION]"$'\n'"> **Jira ticket not found**"$'\n'">"$'\n'"> **$JIRA_KEY** doesn't exist in Jira (or isn't visible to this check). Double-check the ticket ID."
              ;;
            api_error)
              BODY="$MARKER"$'\n'"> [!CAUTION]"$'\n'"> **Could not verify Jira ticket**"$'\n'">"$'\n'"> **$JIRA_KEY** could not be verified against Jira right now (API error, timeout, or missing credentials). This blocks merge until it can be verified - please retry, or contact an admin if this persists."
              ;;
          esac

          PAYLOAD=$(jq -n --arg body "$BODY" '{body: $body}')

          EXISTING_ID=$(
            set -o pipefail
            curl -sf \
              -H "Authorization: token $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$REPO/issues/$PR_NUMBER/comments" \
            | jq -r --arg marker "$MARKER" \
              '.[] | select(.body | contains($marker)) | .id' \
            | head -n1
          ) || {
            echo "::warning::Could not read existing PR comments (check token permissions). Continuing without updating a comment."
            EXISTING_ID=""
          }

          if [ -n "$EXISTING_ID" ]; then
            curl -sf -X PATCH \
              -H "Authorization: token $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "Content-Type: application/json" \
              -d "$PAYLOAD" \
              "https://api.github.com/repos/$REPO/issues/comments/$EXISTING_ID" \
              > /dev/null || echo "::warning::Failed to update the PR comment (check token permissions)."
          else
            curl -sf -X POST \
              -H "Authorization: token $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "Content-Type: application/json" \
              -d "$PAYLOAD" \
              "https://api.github.com/repos/$REPO/issues/$PR_NUMBER/comments" \
              > /dev/null || echo "::warning::Failed to post the PR comment (check token permissions)."
          fi

          # -------------------------------------------------------------
          # Only "pass" and "wip" succeed. Everything else fails the job -
          # including api_error: a Jira problem no longer gets a free
          # pass, by design.
          # -------------------------------------------------------------
          if [ "$STATE" = "pass" ] || [ "$STATE" = "wip" ]; then
            exit 0
          else
            exit 1
          fi

  description-check:
    name: PR Description Check
    runs-on: ubuntu-latest
    timeout-minutes: 5

    permissions:
      contents: read
      pull-requests: write
      issues: write

    # Configurable pattern for which changed file paths count as "Local
    # Agent" code. Adjust this one line if the real paths differ - nothing
    # else in the script below needs to change.
    env:
      LOCAL_AGENT_PATH_PATTERNS: '^(compute/|orchestrator/|proxy/)'

    steps:
      - name: Validate PR description content
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e

          MARKER="<!-- pr-description-check-bot -->"
          ERRORS=()
          WARNINGS=()

          # add_error: a blocking problem - missing/empty required content.
          # Shown in red and fails the job.
          add_error() {
            ERRORS+=("$1")
            echo "::error title=PR description check::$1"
          }

          # add_warning: a non-blocking suggestion - content is present but
          # could be improved (e.g. brief, unusual formatting). Shown in
          # yellow and does not fail the job on its own.
          add_warning() {
            WARNINGS+=("$1")
            echo "::warning title=PR description check::$1"
          }

          # -------------------------------------------------------------
          # Normalize the PR body once: strip CRLF line endings and any
          # non-breaking spaces that GitHub's rich-text editor sometimes
          # inserts, which would otherwise break exact heading matches.
          # -------------------------------------------------------------
          printf '%s' "$PR_BODY" \
            | tr -d '\r' \
            | sed 's/\xc2\xa0/ /g' \
            > pr_body.txt

          # -------------------------------------------------------------
          # section_exists SECTION_HEADING
          # Case-insensitive, trailing-whitespace-tolerant check for
          # whether a "## Heading" line exists anywhere in the PR body.
          # -------------------------------------------------------------
          section_exists() {
            awk -v want="$(printf '%s' "$1" | tr '[:upper:]' '[:lower:]')" '
              {
                line = $0
                sub(/[[:space:]]+$/, "", line)
                if (tolower(line) == want) { found = 1; exit }
              }
              END { exit !found }
            ' pr_body.txt
          }

          # -------------------------------------------------------------
          # extract_section SECTION_HEADING
          # Prints the body of one "## Heading" section: template HTML
          # comments and blank lines are stripped. Matching is
          # case-insensitive and tolerant of trailing whitespace, so
          # "## summary " matches "## Summary".
          # -------------------------------------------------------------
          extract_section() {
            awk -v want="$(printf '%s' "$1" | tr '[:upper:]' '[:lower:]')" '
              {
                line = $0
                sub(/[[:space:]]+$/, "", line)
                key = tolower(line)
              }
              key == want { flag = 1; next }
              /^##[[:space:]]/ { flag = 0 }
              flag { print }
            ' pr_body.txt \
              | grep -v '<!--' \
              | sed '/^[[:space:]]*$/d' \
              || true
          }

          # -------------------------------------------------------------
          # Fetch the PR's changed file paths (paginated, capped at 500
          # files as a safety limit) to automatically detect whether this
          # PR touches Local Agent code. This drives enforcement below -
          # not the developer's self-reported checkbox alone - so a PR
          # that genuinely doesn't touch Compute/Orchestrator/Proxy code
          # never has to fill in the extra section, and one that does
          # can't accidentally under-report it.
          # -------------------------------------------------------------
          LOCAL_AGENT_IMPACTED="false"
          PAGE=1
          while : ; do
            FILES_PAGE=$(curl -sf \
              -H "Authorization: token $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$REPO/pulls/$PR_NUMBER/files?per_page=100&page=$PAGE") || {
                echo "::warning::Could not read the PR's changed files (check token permissions). Skipping automatic Local Agent impact detection - relying on the developer's checkbox only."
                break
              }

            COUNT=$(printf '%s' "$FILES_PAGE" | jq 'length')
            [ "$COUNT" -eq 0 ] && break

            if printf '%s' "$FILES_PAGE" | jq -r '.[].filename' | grep -qE "$LOCAL_AGENT_PATH_PATTERNS"; then
              LOCAL_AGENT_IMPACTED="true"
              break
            fi

            [ "$COUNT" -lt 100 ] && break
            PAGE=$((PAGE + 1))
            [ "$PAGE" -gt 5 ] && break
          done

          # -------------------------------------------------------------
          # Empty PR description (including a body that is only
          # whitespace, e.g. someone hit space bar and left the template).
          # -------------------------------------------------------------
          if [ -z "$(tr -d '[:space:]' < pr_body.txt)" ]; then
            add_error "The PR description is empty. Please fill in the PR template."

          else

            # ===========================================================
            # Required sections (structural presence only - content rules
            # for each are applied individually below).
            #
            # NOTE: "## Jira Ticket" is kept here for structure/context
            # only. The enforced, API-verified ticket ID now lives in the
            # PR title itself (see title-check), so this section's
            # *content* is no longer validated.
            # ===========================================================
            REQUIRED_SECTIONS=(
              "## Summary"
              "## Jira Ticket"
              "## Type of Change"
              "## Configuration / Values Changes"
              "## Feature Flag"
              "## Breaking Change Details"
              "## Local Agent Impact"
              "## Local Agent Impact Details"
              "## Testing"
              "## Checklist"
            )

            for SECTION in "${REQUIRED_SECTIONS[@]}"; do
              if ! section_exists "$SECTION"; then
                add_error "Missing the '$SECTION' section. Copy it from the PR template."
              fi
            done

            # ===========================================================
            # Summary
            # ===========================================================
            SUMMARY=$(extract_section "## Summary")

            if [ -z "$SUMMARY" ]; then
              add_error "The 'Summary' section is empty. Describe what this PR does and why."
            elif [ "$(printf '%s' "$SUMMARY" | tr -d '[:space:]' | wc -c)" -lt 20 ]; then
              add_warning "The 'Summary' section is very short. Consider adding more detail about what changed and why."
            fi

            # ===========================================================
            # Type of Change
            # Accepts "-" or "*" bullets, since the template uses "*".
            # Only boxes inside THIS section count - a checked box under
            # Checklist must not satisfy this validation.
            # ===========================================================
            TYPE_OF_CHANGE=$(extract_section "## Type of Change")

            if [ -z "$TYPE_OF_CHANGE" ]; then
              add_error "The 'Type of Change' section is empty."
            elif ! printf '%s\n' "$TYPE_OF_CHANGE" | grep -qE '^[[:space:]]*[-*][[:space:]]*\[[xX]\]'; then
              add_error "No box is checked under 'Type of Change'. Check at least one that applies."
            fi

            # ===========================================================
            # Configuration / Values Changes
            # Accepts Yes/No, or N/A for PRs where the question doesn't
            # apply (e.g. documentation-only changes).
            # ===========================================================
            CONFIG=$(extract_section "## Configuration / Values Changes")

            if [ -z "$CONFIG" ]; then
              add_error "The 'Configuration / Values Changes' section is empty. Answer Yes or No."
            elif ! printf '%s' "$CONFIG" | grep -qiE '\b(yes|no|n/a)\b'; then
              add_warning "The 'Configuration / Values Changes' section doesn't clearly say Yes, No, or N/A - please confirm it's unambiguous."
            fi

            # ===========================================================
            # Feature Flag
            # ===========================================================
            FLAG=$(extract_section "## Feature Flag")

            if [ -z "$FLAG" ]; then
              add_error "The 'Feature Flag' section is empty. Name the flag and its default state, or write 'N/A'."
            fi

            # ===========================================================
            # Testing
            # ===========================================================
            TESTING=$(extract_section "## Testing")

            if [ -z "$TESTING" ]; then
              add_error "The 'Testing' section is empty. Describe how this change was verified."
            fi

            # ===========================================================
            # Breaking Change Details
            # Only required when the "Breaking change" box is checked.
            # ===========================================================
            if printf '%s\n' "$TYPE_OF_CHANGE" | grep -qiE '^[[:space:]]*[-*][[:space:]]*\[[xX]\][[:space:]]*Breaking change'; then
              DETAILS=$(extract_section "## Breaking Change Details")

              if [ -z "$DETAILS" ] || [ "$(printf '%s' "$DETAILS" | tr '[:upper:]' '[:lower:]')" = "n/a" ]; then
                add_error "'Breaking change' is checked, but 'Breaking Change Details' is empty. Describe what breaks and the migration/upgrade path."
              fi
            fi

            # ===========================================================
            # Local Agent Impact
            # Enforcement is driven by the automatic file-based detection
            # above (LOCAL_AGENT_IMPACTED), OR by the developer having
            # proactively checked "Yes" themselves - whichever is true.
            # A PR that touches none of the relevant paths and where the
            # developer hasn't flagged anything sees no requirement here
            # at all, keeping the description lightweight for everyone
            # who isn't touching Local Agent code.
            # ===========================================================
            LOCAL_AGENT_SECTION=$(extract_section "## Local Agent Impact")

            LOCAL_AGENT_YES_CHECKED="false"
            if printf '%s\n' "$LOCAL_AGENT_SECTION" | grep -qiE '^[[:space:]]*[-*][[:space:]]*\[[xX]\][[:space:]]*Yes\b'; then
              LOCAL_AGENT_YES_CHECKED="true"
            fi

            if [ "$LOCAL_AGENT_IMPACTED" = "true" ] && [ "$LOCAL_AGENT_YES_CHECKED" = "false" ]; then
              add_error "This PR changes Compute, Orchestrator, or Proxy code, but 'Local Agent Impact' isn't checked Yes. Check 'Yes' under 'Local Agent Impact' and fill in 'Local Agent Impact Details'."
            fi

            if [ "$LOCAL_AGENT_IMPACTED" = "true" ] || [ "$LOCAL_AGENT_YES_CHECKED" = "true" ]; then
              LOCAL_AGENT_DETAILS=$(extract_section "## Local Agent Impact Details")
              if [ -z "$LOCAL_AGENT_DETAILS" ]; then
                add_error "'Local Agent Impact' is Yes (or Local Agent code changed), but 'Local Agent Impact Details' is empty. Describe the impact and how it was tested."
              fi
            fi

          fi

          # ---------------------------------------------------------------
          # Job summary: a colored pass/fail/warning badge plus the issue
          # list, shown on the workflow run's Summary tab. Three states:
          # red (blocking errors), yellow (passes, but has suggestions),
          # green (clean pass).
          # ---------------------------------------------------------------
          if [ "${#ERRORS[@]}" -gt 0 ]; then
            {
              echo "## ❌ PR Description Check — Failed"
              echo
              echo "![failing](https://img.shields.io/badge/PR%20Description-Failed-red)"
              echo
              echo "**Blocking issues:**"
              for ERROR in "${ERRORS[@]}"; do
                echo "- ❌ $ERROR"
              done
              if [ "${#WARNINGS[@]}" -gt 0 ]; then
                echo
                echo "**Suggestions (non-blocking):**"
                for WARNING in "${WARNINGS[@]}"; do
                  echo "- ⚠️ $WARNING"
                done
              fi
              echo
              echo "See \`.github/pull_request_template.md\` for the expected PR structure."
            } >> "$GITHUB_STEP_SUMMARY"
          elif [ "${#WARNINGS[@]}" -gt 0 ]; then
            {
              echo "## ⚠️ PR Description Check — Passed, with suggestions"
              echo
              echo "![warning](https://img.shields.io/badge/PR%20Description-Passed%20with%20suggestions-yellow)"
              echo
              for WARNING in "${WARNINGS[@]}"; do
                echo "- ⚠️ $WARNING"
              done
            } >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "## ✅ PR Description Check — Passed"
              echo
              echo "![passing](https://img.shields.io/badge/PR%20Description-Passed-brightgreen)"
              echo
              echo "All required sections are present and complete."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

          # ---------------------------------------------------------------
          # Find an existing bot comment so we update it in place instead
          # of leaving a trail of duplicate comments across pushes.
          # `pipefail` is scoped to this subshell so a curl failure is
          # detected instead of being masked by `head`'s exit code.
          # ---------------------------------------------------------------
          EXISTING_ID=$(
            set -o pipefail
            curl -sf \
              -H "Authorization: token $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$REPO/issues/$PR_NUMBER/comments" \
            | jq -r --arg marker "$MARKER" \
              '.[] | select(.body | contains($marker)) | .id' \
            | head -n1
          ) || {
            echo "::warning::Could not read existing PR comments (check token permissions). Continuing without updating a comment."
            EXISTING_ID=""
          }

          # ---------------------------------------------------------------
          # Build the PR comment body using GitHub's "alert" callout
          # syntax ( > [!CAUTION] / > [!WARNING] / > [!TIP] ). GitHub
          # renders these as colored boxes (red / yellow / green) in
          # rendered markdown - this is the one form of real color GitHub
          # allows in a PR comment; inline HTML/CSS color is stripped out.
          # ---------------------------------------------------------------
          BODY="$MARKER"$'\n'

          if [ "${#ERRORS[@]}" -gt 0 ]; then
            BODY+="> [!CAUTION]"$'\n'
            BODY+="> **PR description needs a few fixes**"$'\n'
            BODY+=">"$'\n'
            for ERROR in "${ERRORS[@]}"; do
              BODY+="> - ❌ $ERROR"$'\n'
            done
            if [ "${#WARNINGS[@]}" -gt 0 ]; then
              BODY+=">"$'\n'
              BODY+="> **Suggestions (non-blocking):**"$'\n'
              for WARNING in "${WARNINGS[@]}"; do
                BODY+="> - ⚠️ $WARNING"$'\n'
              done
            fi
            BODY+=">"$'\n'
            BODY+="> See \`.github/pull_request_template.md\` for the expected PR structure."

          elif [ "${#WARNINGS[@]}" -gt 0 ]; then
            BODY+="> [!WARNING]"$'\n'
            BODY+="> **PR description passes, with a few suggestions**"$'\n'
            BODY+=">"$'\n'
            for WARNING in "${WARNINGS[@]}"; do
              BODY+="> - ⚠️ $WARNING"$'\n'
            done

          else
            BODY+="> [!TIP]"$'\n'
            BODY+="> **PR description looks good** ✅"
          fi

          PAYLOAD=$(jq -n --arg body "$BODY" '{body: $body}')

          # ---------------------------------------------------------------
          # Post or update the PR comment, then pass/fail the job.
          # Comment posting is best-effort: a failure to comment (for
          # example a permissions hiccup) is reported as a warning but
          # never masks the actual pass/fail result of the check itself.
          # ---------------------------------------------------------------
          if [ -n "$EXISTING_ID" ]; then
            curl -sf -X PATCH \
              -H "Authorization: token $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "Content-Type: application/json" \
              -d "$PAYLOAD" \
              "https://api.github.com/repos/$REPO/issues/comments/$EXISTING_ID" \
              > /dev/null || echo "::warning::Failed to update the PR comment (check token permissions)."
          else
            curl -sf -X POST \
              -H "Authorization: token $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "Content-Type: application/json" \
              -d "$PAYLOAD" \
              "https://api.github.com/repos/$REPO/issues/$PR_NUMBER/comments" \
              > /dev/null || echo "::warning::Failed to post the PR comment (check token permissions)."
          fi

          # Only blocking errors fail the job. Non-blocking suggestions
          # are surfaced (comment + summary) but do not stop the merge.
          if [ "${#ERRORS[@]}" -gt 0 ]; then
            exit 1
          else
            echo "PR description passed all checks."
          fi
