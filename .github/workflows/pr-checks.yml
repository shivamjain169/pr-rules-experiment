name: "PR Standards Check"

on:
  pull_request_target:
    types:
      - opened
      - edited
      - synchronize

permissions:
  pull-requests: read

jobs:

  # IMPORTANT:
  # Keep these job IDs unchanged because they are referenced by the
  # repository ruleset required status checks.
  title-check:
    runs-on: ubuntu-latest

    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            revert
          requireScope: false
          subjectPattern: ^(?![A-Z]).+$
          subjectPatternError: |
            The description after the colon must start with a lowercase
            letter (e.g. "fix: correct retry logic", not "fix: Correct...").
          wip: true
          validateSingleCommit: false

  description-check:
    runs-on: ubuntu-latest

    permissions:
      pull-requests: write
      issues: write
      contents: read

    steps:
      - name: Validate PR description content
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

        run: |
          set -e

          # ---------------------------------------------------------------
          # Normalize line endings.
          # ---------------------------------------------------------------
          printf '%s' "$PR_BODY" | tr -d '\r' > pr_body.txt

          MARKER="<!-- pr-description-check-bot -->"
          ERRORS=()

          add_error() {
            ERRORS+=("$1")
            echo "::error title=PR description check::$1"
          }

          # ---------------------------------------------------------------
          # Extract content belonging to one ## section.
          #
          # HTML comments from the template are ignored and empty lines
          # are removed.
          # ---------------------------------------------------------------
          extract_section() {
            awk -v sec="$1" '
              $0 == sec {
                flag=1
                next
              }

              /^## / {
                flag=0
              }

              flag {
                print
              }
            ' pr_body.txt \
              | grep -v '<!--' \
              | sed '/^[[:space:]]*$/d' \
              || true
          }

          # ---------------------------------------------------------------
          # Empty PR description
          # ---------------------------------------------------------------
          if [ -z "$PR_BODY" ]; then
            add_error "The PR description is empty. Please fill in the PR template."

          else

            # ===============================================================
            # Required sections
            # These MUST match .github/pull_request_template.md
            # ===============================================================
            REQUIRED_SECTIONS=(
              "## Summary"
              "## Jira Ticket"
              "## Type of Change"
              "## Configuration / Values Changes"
              "## Feature Flag"
              "## Breaking Change Details"
              "## Testing"
              "## Checklist"
            )

            for SECTION in "${REQUIRED_SECTIONS[@]}"; do
              if ! grep -qF "$SECTION" pr_body.txt; then
                add_error "Missing the '$SECTION' section. Copy it from the PR template."
              fi
            done

            # ===============================================================
            # Summary
            # ===============================================================
            SUMMARY=$(extract_section "## Summary")

            if [ -z "$SUMMARY" ]; then
              add_error "The 'Summary' section is empty. Describe what this PR does and why."

            elif [ "$(printf '%s' "$SUMMARY" | tr -d '[:space:]' | wc -c)" -lt 20 ]; then
              add_error "The 'Summary' section is very short. Add more detail about what changed and why."
            fi

            # ===============================================================
            # Jira Ticket
            # ===============================================================
            JIRA=$(extract_section "## Jira Ticket")

            if [ -z "$JIRA" ]; then
              add_error "The 'Jira Ticket' section is empty. Add a ticket key (e.g. PROJ-123), or write 'No related ticket'."

            elif ! printf '%s' "$JIRA" | grep -qE '[A-Z]{2,10}-[0-9]+' \
              && ! printf '%s' "$JIRA" | grep -qi "no related ticket"; then

              add_error "The 'Jira Ticket' section doesn't contain a recognizable ticket key (e.g. PROJ-123), and doesn't say 'No related ticket' either."
            fi

            # ===============================================================
            # Type of Change
            #
            # IMPORTANT:
            # Only check boxes inside the Type of Change section.
            # A checked box in Checklist must NOT satisfy this validation.
            # ===============================================================
            TYPE_OF_CHANGE=$(extract_section "## Type of Change")

            if [ -z "$TYPE_OF_CHANGE" ]; then
              add_error "The 'Type of Change' section is empty."

            elif ! printf '%s\n' "$TYPE_OF_CHANGE" \
              | grep -qE '^[[:space:]]*-[[:space:]]*\[[xX]\]'; then

              add_error "No box is checked under 'Type of Change'. Check at least one that applies."
            fi

            # ===============================================================
            # Configuration / Values Changes
            # ===============================================================
            CONFIG=$(extract_section "## Configuration / Values Changes")

            if [ -z "$CONFIG" ]; then
              add_error "The 'Configuration / Values Changes' section is empty. Answer Yes or No."

            elif ! printf '%s' "$CONFIG" | grep -qiE '\b(yes|no)\b'; then
              add_error "The 'Configuration / Values Changes' section must clearly say Yes or No."
            fi

            # ===============================================================
            # Feature Flag
            # ===============================================================
            FLAG=$(extract_section "## Feature Flag")

            if [ -z "$FLAG" ]; then
              add_error "The 'Feature Flag' section is empty. Name the flag and its default state, or write 'N/A'."
            fi

            # ===============================================================
            # Testing
            # ===============================================================
            TESTING=$(extract_section "## Testing")

            if [ -z "$TESTING" ]; then
              add_error "The 'Testing' section is empty. Describe how this change was verified."
            fi

            # ===============================================================
            # Breaking Change Details
            #
            # Only required when the Breaking Change checkbox is selected.
            # ===============================================================
            TYPE_OF_CHANGE=$(extract_section "## Type of Change")

            if printf '%s\n' "$TYPE_OF_CHANGE" \
              | grep -qiE '^[[:space:]]*-[[:space:]]*\[[xX]\][[:space:]]*Breaking change'; then

              DETAILS=$(extract_section "## Breaking Change Details")

              if [ -z "$DETAILS" ] || [ "$DETAILS" = "N/A" ]; then
                add_error "'Breaking change' is checked, but 'Breaking Change Details' is empty. Describe what breaks and the migration/upgrade path."
              fi
            fi

          fi

          # ===============================================================
          # Find existing bot comment
          # ===============================================================
          EXISTING_ID=$(curl -s \
            -H "Authorization: token $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPO/issues/$PR_NUMBER/comments" \
            | jq -r --arg marker "$MARKER" \
              '.[] | select(.body | contains($marker)) | .id' \
            | head -n1)

          # ===============================================================
          # Report failures
          # ===============================================================
          if [ "${#ERRORS[@]}" -gt 0 ]; then

            BODY="$MARKER"$'\n'
            BODY+="### PR description needs a few fixes"$'\n\n'

            for ERROR in "${ERRORS[@]}"; do
              BODY+="- $ERROR"$'\n'
            done

            BODY+=$'\n'"See \`.github/pull_request_template.md\` for the expected PR structure."

            PAYLOAD=$(jq -n --arg body "$BODY" '{body: $body}')

            if [ -n "$EXISTING_ID" ]; then

              curl -s -X PATCH \
                -H "Authorization: token $GH_TOKEN" \
                -H "Accept: application/vnd.github+json" \
                -H "Content-Type: application/json" \
                -d "$PAYLOAD" \
                "https://api.github.com/repos/$REPO/issues/comments/$EXISTING_ID" \
                > /dev/null

            else

              curl -s -X POST \
                -H "Authorization: token $GH_TOKEN" \
                -H "Accept: application/vnd.github+json" \
                -H "Content-Type: application/json" \
                -d "$PAYLOAD" \
                "https://api.github.com/repos/$REPO/issues/$PR_NUMBER/comments" \
                > /dev/null

            fi

            exit 1

          else

            # =============================================================
            # Remove/update previous bot comment after successful validation
            # =============================================================
            if [ -n "$EXISTING_ID" ]; then

              BODY="$MARKER"$'\n'
              BODY+="### PR description looks good"

              PAYLOAD=$(jq -n --arg body "$BODY" '{body: $body}')

              curl -s -X PATCH \
                -H "Authorization: token $GH_TOKEN" \
                -H "Accept: application/vnd.github+json" \
                -H "Content-Type: application/json" \
                -d "$PAYLOAD" \
                "https://api.github.com/repos/$REPO/issues/comments/$EXISTING_ID" \
                > /dev/null
            fi

            echo "PR description passed all checks."

          fi
